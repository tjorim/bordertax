name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/dependabot.yml'

  app:
    name: App
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app-ci.yml

  pr-preview:
    name: PR preview
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/pr-preview.yml
    permissions:
      contents: read
      pull-requests: write

  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - app
      - pr-preview
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have passed or been skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
