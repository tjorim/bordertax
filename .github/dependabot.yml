version: 2
updates:
  - package-ecosystem: "npm"
    allow:
      - dependency-type: all
    directory: "/"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "platform:frontend"
    versioning-strategy: "increase"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # tailwindcss and its Vite plugin share one release train
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # OXC toolchain: linter, formatter and parser
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxc-parser"
      # Inlang i18n packages
      i18n:
        patterns:
          - "@inlang/*"
      # Vitest and Testing Library
      # tinybench is vitest's benchmark runner; it is a transitive dependency
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
          - "tinybench"
      # Browser APIs the tests run against; separate projects from Vitest, so reviewed on their own
      test-env:
        patterns:
          - "happy-dom"
          - "fake-indexeddb"
      # msw's own stack: msw, its @msw/@mswjs packages, and the helpers and cookie/URL packages it ships with.
      # Generic utilities it reaches (yargs, wrap-ansi, type-fest, graphql, ...) stay ungrouped.
      msw:
        patterns:
          - "msw"
          - "@msw/*"
          - "@mswjs/*"
          - "@open-draft/until"
          - "@inquirer/*"
          - "tldts"
          - "tldts-core"
          - "tough-cookie"
          - "outvariant"
          - "rettime"
          - "headers-polyfill"
          - "until-async"
          - "is-node-process"
      # Playwright and the axe-core integration used by the e2e suite
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/*"
      # TanStack Router with its internals; seroval is router-core's serializer
      tanstack-router:
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/router-*"
          - "@tanstack/history"
          - "isbot"
          - "seroval"
          - "seroval-plugins"
      # TanStack Table adapter and core must update together or pipelines fail
      tanstack-table:
        patterns:
          - "@tanstack/react-table"
          - "@tanstack/table-core"
      # @tanstack/charts pulls in the d3-* modules (d3-scale, d3-brush, d3-zoom, ...) as runtime
      # dependencies; they release individually and must move with it. svelte stays ungrouped:
      # inlang and oxfmt also depend on it
      charts:
        patterns:
          - "@tanstack/charts"
          - "d3-*"
          - "@types/d3-*"
      # Babel packages are transitive and must resolve to one version per major line
      babel:
        patterns:
          - "@babel/*"
      # TypeScript and its runtime helpers
      typescript:
        patterns:
          - "typescript"
          - "tslib"
      # Base UI is the shipped runtime (@base-ui/react and its pinned @base-ui/utils);
      # its behaviour changes get their own PR
      base-ui:
        patterns:
          - "@base-ui/*"
      # shadcn CLI and its registry tooling (dev-only). Kept apart from the Base UI runtime group so a
      # regression is attributable to one of them (docs/ui-maintenance.md)
      shadcn:
        patterns:
          - "shadcn"
          - "@shadcn/*"
      # Icon set kept in its own group so icon releases are reviewed separately
      lucide:
        patterns:
          - "lucide-react"
      # rolldown ships per-platform @rolldown/binding-* packages that move with it
      rolldown:
        patterns:
          - "rolldown"
          - "@rolldown/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
