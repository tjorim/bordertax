version: 2
updates:
  - package-ecosystem: "npm"
    allow:
      - dependency-type: all
    directory: "/"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "platform:frontend"
    versioning-strategy: "increase"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          # rolldown is Vite's bundler
          - "rolldown"
          - "@rolldown/*"
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
          - "tinybench"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxc-parser"
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/*"
      i18n:
        patterns:
          - "@inlang/*"
      # tailwindcss and its Vite plugin share one release train
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # shadcn CLI is pinned and Base UI is the runtime; review them together
      ui-runtime:
        patterns:
          - "shadcn"
          - "@shadcn/*"
          - "@base-ui/react"
      # transitive runtime deps pulled in by @tanstack/charts
      d3:
        patterns:
          - "d3-*"
      types:
        patterns:
          - "@types/*"
          - "@babel/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
