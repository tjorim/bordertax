version: 2
updates:
  - package-ecosystem: "npm"
    allow:
      - dependency-type: all
    directory: "/"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "platform:frontend"
    versioning-strategy: "increase"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
          - "tinybench"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxc-parser"
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/*"
      i18n:
        patterns:
          - "@inlang/*"
      # tailwindcss and its Vite plugin share one release train
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # shadcn CLI is pinned and Base UI is the runtime; review them together
      # rolldown ships per-platform @rolldown/binding-* packages that move with it
      rolldown:
        patterns:
          - "rolldown"
          - "@rolldown/*"
      ui-runtime:
        patterns:
          - "shadcn"
          - "@shadcn/*"
          - "@base-ui/react"
      # @tanstack/charts pins its d3-* dependencies, so they move together
      charts:
        patterns:
          - "@tanstack/charts"
          - "d3-*"
      types:
        patterns:
          - "@types/*"
          - "@babel/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    assignees:
      - "tjorim"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
